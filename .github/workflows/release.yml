name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM artifacts
        run: cargo build --target wasm32-unknown-unknown --release

      # See scripts/fix-wasm-compat.sh: modern rustc/LLD emits a WASM
      # encoding Soroban's VM rejects outright, regardless of rustc flags.
      # Without this, every published release artifact would fail to
      # deploy to any real Soroban network.
      - name: Install wasm-opt
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz | tar -xz
          echo "$PWD/binaryen-version_132/bin" >> "$GITHUB_PATH"

      - name: Fix WASM compatibility
        run: bash scripts/fix-wasm-compat.sh

      - name: Generate changelog from conventional commits
        id: changelog
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          files: |
            target/wasm32-unknown-unknown/release/*.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
